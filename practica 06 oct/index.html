<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica - Recomendador de Contenido</title>
  <style>
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #F5F5F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      background-color: #1E1E1E;
      border: 1px solid #2A2A2A;
      border-top: 4px solid #E50914; /* Acento rojo arriba */
      border-radius: 12px;
      padding: 35px 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    h2 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }

    /* FORMULARIO E INPUTS */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #CCCCCC;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: #2A2A2A;
      border: 1px solid #3D3D3D;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #E50914;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.4);
      background-color: #333333;
    }

    select option {
      background-color: #1E1E1E;
      color: #FFFFFF;
    }

    /* BOTÓN */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background-color: #E50914;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #B80710;
    }

    button:active {
      transform: scale(0.98);
    }

    /* ÁREA DE RESULTADO */
    #resultado {
      margin-top: 30px;
    }

    .card-resultado {
      background-color: #262626;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .card-resultado h3 {
      font-size: 1.2rem;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .card-resultado p {
      font-size: 1rem;
      color: #B0B0B0;
      margin-bottom: 15px;
    }

    .badge {
      color: #E50914;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-resultado img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #3D3D3D;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Registro de Usuario</h2>

    <form id="userForm">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
      </div>

      <div class="form-group">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" min="1" max="120" placeholder="Ej. 22" required>
      </div>

      <div class="form-group">
        <label for="sexo">Sexo:</label>
        <select id="sexo" required>
          <option value="">Selecciona...</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
        </select>
      </div>

      <button type="button" onclick="procesarUsuario()">Procesar</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const usuarios = [];

    function procesarUsuario() {
      const nombre = document.getElementById('nombre').value.trim();
      const edad = parseInt(document.getElementById('edad').value);
      const sexo = document.getElementById('sexo').value;
      const divResultado = document.getElementById('resultado');

      if (!nombre || isNaN(edad) || !sexo) {
        alert("Por favor, llena todos los campos correctamente.");
        return;
      }

      let imagenUrl = "";
      let etiqueta = "";

      if (edad < 18) {
        if (sexo === 'M') {
          etiqueta = "Cine";
          imagenUrl = "https://th.bing.com/th/id/R.09b879668da8670f656e951aa2014117?rik=4RlEp4kvheJh%2bg&pid=ImgRaw&r=0"; 
        } else if (sexo === 'F') {
          etiqueta = "Barbie";
          imagenUrl = "https://www.hollywoodreporter.com/wp-content/uploads/2023/06/margot-robbie-barbie-doll-H-2023.jpg?w=1024"; 
        }
      } else if (edad >= 18 && edad <= 30) {
        if (sexo === 'M') {
          etiqueta = "Antro";
          imagenUrl = "https://media.timeout.com/images/103564392/image.jpg"; 
        } else if (sexo === 'F') {
          etiqueta = "Spa";
          imagenUrl = "https://img.grouponcdn.com/sparta/PJ62GE3ZagXBY3zrXNVZuz/3W-1536x1024.jpg"; 
        }
      } else if (edad > 30) { 
        if (sexo === 'M') {
          etiqueta = "Gym";
          imagenUrl = "https://tse4.mm.bing.net/th/id/OIP.LmPP4h_RPtaR5QUrXgR3YgHaE7?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"; 
        } else if (sexo === 'F') {
          etiqueta = "Brunch";
          imagenUrl = "https://www.lazybrunch.fr/wp-content/uploads/2025/09/freepik__the-style-is-candid-image-photography-with-natural__82733.png"; 
        }
      }

      const nuevoUsuario = {
        nombre: nombre,
        edad: edad,
        sexo: sexo,
        recomendacion: etiqueta,
        imagen: imagenUrl,
        fechaRegistro: new Date().toLocaleString()
      };

      usuarios.push(nuevoUsuario);

      divResultado.innerHTML = `
        <div class="card-resultado">
          <h3>Hola, ${nuevoUsuario.nombre}</h3>
          <p>Recomendación: <span class="badge">${nuevoUsuario.recomendacion}</span></p>
          <img src="${nuevoUsuario.imagen}" alt="${nuevoUsuario.recomendacion}">
        </div>
      `;

      document.getElementById('userForm').reset();

      console.log("Usuarios guardados en el arreglo:", usuarios);
    }
  </script>

</body>
</html>
